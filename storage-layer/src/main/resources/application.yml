server:
  port: 8084

spring:
  application:
    name: storage-layer
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring_meta
    username: monitor
    password: monitor_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

prometheus:
  url: http://localhost:9090
