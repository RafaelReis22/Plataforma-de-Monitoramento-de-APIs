name: Varredura de Segurança

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Executa às 02:00 BRT (05:00 UTC) todos os dias
    - cron: '0 5 * * *'

jobs:

  # ── Análise de dependências OWASP ──────────────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar OWASP Dependency Check
        run: |
          mvn --batch-mode \
            org.owasp:dependency-check-maven:9.0.9:aggregate \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DsuppressionFile=infra/security/owasp-suppressions.xml \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            --no-transfer-progress

      - name: Publicar relatório OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  # ── Varredura de secrets com Gitleaks ──────────────────────────────────────
  secrets-scan:
    name: Detecção de Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Varredura de imagens Docker com Trivy ─────────────────────────────────
  trivy-scan:
    name: Trivy — Imagens Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Serviços que possuem Dockerfile no projeto
        service:
          - monitoring-agent
          - api-gateway-interceptor
          - observability-pipeline
          - storage-layer
          - dashboard-service
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build da imagem ${{ matrix.service }}
        run: |
          mvn --batch-mode -pl ${{ matrix.service }} package -DskipTests --no-transfer-progress
          docker build -t api-monitoring/${{ matrix.service }}:ci ${{ matrix.service }}/

      - name: Executar Trivy na imagem ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-monitoring/${{ matrix.service }}:ci'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Publicar resultado SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  # ── CodeQL — análise estática de código Java ──────────────────────────────
  codeql-analysis:
    name: CodeQL — Análise Estática
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build para análise CodeQL
        run: mvn --batch-mode package -DskipTests --no-transfer-progress

      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java'
