server:
  port: 8081

spring:
  application:
    name: monitoring-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

monitoring:
  collection:
    interval-ms: 15000
  proc:
    base-path: /proc   # Docker override: /host/proc
