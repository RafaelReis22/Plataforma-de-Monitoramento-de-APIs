# ── storage-layer ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-layer
  namespace: api-monitoring
  labels:
    app: storage-layer
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-layer
  template:
    metadata:
      labels:
        app: storage-layer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: storage-layer
          image: api-monitoring/storage-layer:1.0.0
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: monitoring-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/monitoring_meta
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-layer
  namespace: api-monitoring
spec:
  selector:
    app: storage-layer
  ports:
    - port: 8084
      targetPort: 8084
---
