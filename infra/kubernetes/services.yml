# Serviços de aplicação — Deployments + Services para todos os 5 módulos Java
---
# ── monitoring-agent ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-agent
  namespace: api-monitoring
  labels:
    app: monitoring-agent
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-agent
  template:
    metadata:
      labels:
        app: monitoring-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      hostPID: true  # necessário para OSHI ler processos do host
      containers:
        - name: monitoring-agent
          image: api-monitoring/monitoring-agent:1.0.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: monitoring-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-agent
  namespace: api-monitoring
spec:
  selector:
    app: monitoring-agent
  ports:
    - port: 8081
      targetPort: 8081
---
# ── api-interceptor ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-interceptor
  namespace: api-monitoring
  labels:
    app: api-interceptor
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-interceptor
  template:
    metadata:
      labels:
        app: api-interceptor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api-interceptor
          image: api-monitoring/api-interceptor:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: monitoring-config
          env:
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-interceptor
  namespace: api-monitoring
spec:
  selector:
    app: api-interceptor
  ports:
    - port: 8082
      targetPort: 8082
---
