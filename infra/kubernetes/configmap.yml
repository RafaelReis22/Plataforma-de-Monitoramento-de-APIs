apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: api-monitoring
data:
  # Configurações compartilhadas entre serviços
  SPRING_PROFILES_ACTIVE: "docker"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_MONITORING: "DEBUG"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: api-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'kubernetes'
        environment: 'production'

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: 'monitoring-agent'
        static_configs:
          - targets: ['monitoring-agent:8081']
        metrics_path: /actuator/prometheus

      - job_name: 'api-interceptor'
        static_configs:
          - targets: ['api-interceptor:8082']
        metrics_path: /actuator/prometheus

      - job_name: 'observability-pipeline'
        static_configs:
          - targets: ['observability-pipeline:8083']
        metrics_path: /actuator/prometheus

      - job_name: 'storage-layer'
        static_configs:
          - targets: ['storage-layer:8084']
        metrics_path: /actuator/prometheus

      - job_name: 'dashboard-service'
        static_configs:
          - targets: ['dashboard-service:8085']
        metrics_path: /actuator/prometheus

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: /metrics
