apiVersion: 1

providers:
  - name: 'API Monitoring Platform'
    orgId: 1
    folder: 'API Monitoring'
    folderUid: 'api-monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
