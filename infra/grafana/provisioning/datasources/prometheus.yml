apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090    # nome de serviço na monitoring-net
    isDefault: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 30s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.53.0
    version: 1
    editable: false
